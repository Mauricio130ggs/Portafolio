<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Archivos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="header-left">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <div>
                        <h1>Visualizador de Archivos</h1>
                        <p class="subtitle">PDF, Word y Excel</p>
                    </div>
                </div>
                <button id="clearBtn" class="btn btn-danger hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Limpiar
                </button>
            </div>

            <div id="uploadZone" class="upload-zone">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <h3 class="upload-title">Sube tu archivo</h3>
                <p class="upload-description">Formatos soportados: PDF, DOCX, DOC, XLSX, XLS</p>
                <label for="fileInput">
                    <span class="btn btn-primary">Seleccionar Archivo</span>
                </label>
                <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx,.xlsx,.xls">
            </div>

            <div id="fileInfoZone" class="hidden">
                <div class="file-info">
                    <div class="file-info-left">
                        <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <div>
                            <div class="file-name" id="fileName"></div>
                            <div class="file-size" id="fileSize"></div>
                        </div>
                    </div>
                    <span class="badge" id="fileType"></span>
                </div>

                <div id="errorAlert" class="alert hidden">
                    <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <p class="alert-text" id="errorText"></p>
                </div>

                <div id="loader" class="loader hidden">
                    <div class="spinner"></div>
                </div>

                <div id="viewer" class="viewer hidden"></div>
            </div>
        </div>

        <div class="footer">
            <p>Los archivos se procesan en tu navegador. No se suben a ningún servidor.</p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const fileInfoZone = document.getElementById('fileInfoZone');
        const clearBtn = document.getElementById('clearBtn');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const errorAlert = document.getElementById('errorAlert');
        const errorText = document.getElementById('errorText');
        const loader = document.getElementById('loader');
        const viewer = document.getElementById('viewer');

        let currentFile = null;
        let currentURL = null;

        fileInput.addEventListener('change', handleFileSelect);
        clearBtn.addEventListener('click', clearFile);

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentFile = file;
            const extension = file.name.split('.').pop().toLowerCase();

            uploadZone.classList.add('hidden');
            fileInfoZone.classList.remove('hidden');
            clearBtn.classList.remove('hidden');

            fileName.textContent = file.name;
            fileSize.textContent = (file.size / 1024).toFixed(2) + ' KB';
            fileType.textContent = extension;

            errorAlert.classList.add('hidden');
            viewer.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                if (extension === 'pdf') {
                    await handlePDF(file);
                } else if (extension === 'docx' || extension === 'doc') {
                    await handleWord(file);
                } else if (extension === 'xlsx' || extension === 'xls') {
                    await handleExcel(file);
                } else {
                    throw new Error('Formato de archivo no soportado. Por favor, sube un PDF, Word o Excel.');
                }
            } catch (err) {
                showError('Error al procesar el archivo: ' + err.message);
            } finally {
                loader.classList.add('hidden');
            }
        }

        async function handlePDF(file) {
            if (currentURL) {
                URL.revokeObjectURL(currentURL);
            }
            currentURL = URL.createObjectURL(file);
            viewer.innerHTML = `<iframe src="${currentURL}" title="PDF Viewer"></iframe>`;
            viewer.classList.remove('hidden');
        }

        async function handleWord(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer });
            viewer.innerHTML = `<div class="content-viewer">${result.value}</div>`;
            viewer.classList.remove('hidden');
        }

        async function handleExcel(file) {
            const arrayBuffer = await file.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            
            let htmlContent = '<div class="content-viewer">';
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const htmlTable = XLSX.utils.sheet_to_html(worksheet);
                htmlContent += `
                    <div class="excel-sheet">
                        <h3 class="sheet-title">${sheetName}</h3>
                        ${htmlTable}
                    </div>
                `;
            });
            htmlContent += '</div>';
            
            viewer.innerHTML = htmlContent;
            viewer.classList.remove('hidden');
        }

        function showError(message) {
            errorText.textContent = message;
            errorAlert.classList.remove('hidden');
        }

        function clearFile() {
            if (currentURL) {
                URL.revokeObjectURL(currentURL);
                currentURL = null;
            }
            
            currentFile = null;
            fileInput.value = '';
            
            uploadZone.classList.remove('hidden');
            fileInfoZone.classList.add('hidden');
            clearBtn.classList.add('hidden');
            errorAlert.classList.add('hidden');
            viewer.classList.add('hidden');
            viewer.innerHTML = '';
        }
    </script>
</body>
</html>
